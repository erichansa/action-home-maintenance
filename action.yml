name: 'Smart Home Maintenance Checklist'
description: 'Injects seasonal home maintenance checklists and cost-saving tips into your README. Powered by FixCostHome.com.'
author: 'FixCostHome.com <support@fixcosthome.com>'
branding:
  icon: 'tool'
  color: 'blue'

inputs:
  readme-path:
    description: 'Path to the README file to update'
    required: false
    default: 'README.md'
  tag-start:
    description: 'Starting comment tag for injection'
    required: false
    default: '<!-- HOME-MAINTENANCE:START -->'
  tag-end:
    description: 'Ending comment tag for injection'
    required: false
    default: '<!-- HOME-MAINTENANCE:END -->'

runs:
  using: 'node20'
  main: 'index.js'
